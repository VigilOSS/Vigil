name: ci

# Each pytest scope stays a separate invocation: root and assess suites have
# colliding module basenames. Absolute paths keep uv's backend cwd from changing
# which suite is selected. Backend includes sync-lint; assess includes readiness.
# Short eval/lint/type checks share one runner to avoid per-job minute rounding.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install JJ for workspace integration tests
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/jj-vcs/jj/releases/download/v0.40.0/jj-v0.40.0-x86_64-unknown-linux-musl.tar.gz \
            --output "${RUNNER_TEMP}/jj.tar.gz"
          echo "5c8979f46873e052f59bdd9535636dca6e6f9f70571b73f6d63c3b92acfaa037  ${RUNNER_TEMP}/jj.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/jj-bin"
          tar -xzf "${RUNNER_TEMP}/jj.tar.gz" -C "${RUNNER_TEMP}/jj-bin" ./jj
          echo "${RUNNER_TEMP}/jj-bin" >> "$GITHUB_PATH"
      - name: Run backend test suite
        # --extra dev installs pytest/httpx (declared under
        # [project.optional-dependencies].dev); `uv run` does NOT install
        # extras by default, so omitting this fails with "Failed to spawn: pytest"
        # in a clean CI env (passes locally only with a warm .venv).
        # Hosted private-repo runners expose two vCPUs; -n auto sees one physical core.
        run: uv run --directory orchestrator/backend --extra dev pytest -n 2

  quality-checks:
    name: eval, lint and types (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Enforce public maintainer identity in canonical history
        env:
          ALLOW_CONTRIBUTORS: ${{ github.event_name == 'pull_request' || github.repository != 'VigilOSS/Vigil' }}
        run: |
          if [ "$ALLOW_CONTRIBUTORS" = true ]; then
            python3 tools/check_public_commit_identity.py --revision HEAD --allow-contributors
          else
            python3 tools/check_public_commit_identity.py --revision HEAD
          fi
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Resolve the suite from the checkout, not uv's backend cwd.
      - name: Run deterministic eval harness
        run: uv run --directory orchestrator/backend --extra dev pytest "${GITHUB_WORKSPACE}/tests/eval" -q
      - name: ruff check
        if: ${{ !cancelled() }}
        run: uvx ruff@0.16.8 check .
      - name: mypy
        if: ${{ !cancelled() }}
        run: uvx --from mypy==2.3.1 --with-editable . mypy src/vigil_cli

  root-tests:
    name: root tests — CLI (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install JJ for workspace integration tests
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/jj-vcs/jj/releases/download/v0.40.0/jj-v0.40.0-x86_64-unknown-linux-musl.tar.gz \
            --output "${RUNNER_TEMP}/jj.tar.gz"
          echo "5c8979f46873e052f59bdd9535636dca6e6f9f70571b73f6d63c3b92acfaa037  ${RUNNER_TEMP}/jj.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/jj-bin"
          tar -xzf "${RUNNER_TEMP}/jj.tar.gz" -C "${RUNNER_TEMP}/jj-bin" ./jj
          echo "${RUNNER_TEMP}/jj-bin" >> "$GITHUB_PATH"
      # Resolve the suite from the checkout, not uv's backend cwd.
      # `tests/eval` is ignored here because quality-checks owns it; running it
      # twice buys nothing and doubles the time to a red signal.
      # Never run a bare `pytest` from the repo root: duplicate
      # `test_vigil_cli.py` basenames in `tests/` and
      # `agent/scripts/assess/tests/` collide under one collection, which is why
      # these two suites are separate jobs rather than one invocation.
      - name: Run root test suite
        run: >-
          uv run --directory orchestrator/backend --extra dev pytest
          "${GITHUB_WORKSPACE}/tests" -q
          --ignore="${GITHUB_WORKSPACE}/tests/eval"

  assess-tests:
    name: assess CLI pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # Resolve the suite from the checkout, not uv's backend cwd.
      - name: Run assess CLI test suite
        run: >-
          uv run --directory orchestrator/backend --extra dev pytest
          "${GITHUB_WORKSPACE}/agent/scripts/assess/tests" -q

  frontend-build:
    name: frontend build (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend (typecheck + bundle)
        run: npm run build
      - name: Run frontend tests
        run: npm test

  report-build:
    name: report template build (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/report
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/report/package-lock.json
      - name: Install locked report dependencies
        run: npm ci
      - name: Build report template (typecheck + bundle)
        run: npm run build
      # The report synthesizes a `curl` command from attacker-influenced finding
      # data and a reader is expected to paste it into a shell, so the quoting is
      # a security boundary (ADR 0018) and is asserted against a real bash.
      - name: Run report tests
        run: npm test
