name: ci

# PR gate for the orchestrator backend + deterministic evals.
#
# BLOCKING jobs (must be green to merge):
#   - backend-tests : `uv run --directory orchestrator/backend pytest`
#                     (the full backend suite, which includes the
#                      markdown-vs-CLI sync-lint test_skill_cli_sync.py)
#   - eval          : the deterministic eval harness under tests/eval, run
#                     with an ABSOLUTE path. A *relative* path under
#                     `--directory orchestrator/backend` resolves against the
#                     backend cwd, collects zero tests, and pytest exits 0 —
#                     a false green. The absolute path is load-bearing.
#   - root-tests    : the root `tests/` suite (CLI + bench harness), minus
#                     tests/eval which has its own job. ABSOLUTE path, same
#                     false-green trap as `eval`.
#   - assess-tests  : the whole `agent/scripts/assess/tests` suite. ABSOLUTE
#                     path, same trap. Supersedes the two-file `code-readiness`
#                     job's coverage but does not replace it: that job is kept
#                     so a readiness-contract break names itself instead of
#                     hiding in a 1400-test run.
#   - code-readiness: target-specific assess transition/readiness contract tests.
#   - frontend-build: installs the locked frontend dependencies and compiles the
#                     code-analysis readiness consumer.
#   - ruff / mypy   : lint (`uvx ruff check .`) and types
#                     (`uvx --with-editable . mypy src/vigil_cli`). The tree is
#                     now lint- and type-clean, so these are blocking gates:
#                     any new finding fails the PR. (Promoted from the former
#                     non-blocking / continue-on-error state.)
#
# OFF the PR path:
#   - nightly-live-eval-capture : a scheduled stub for the live
#                     eval-capture e2e (needs a running runtime/orchestrator).
#                     Guarded behind a repo secret so forks/PRs never trip it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 07:00 UTC — drives the opt-in live eval-capture e2e only.
    - cron: "0 7 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run backend test suite
        # --extra dev installs pytest/httpx (declared under
        # [project.optional-dependencies].dev); `uv run` does NOT install
        # extras by default, so omitting this fails with "Failed to spawn: pytest"
        # in a clean CI env (passes locally only with a warm .venv).
        run: uv run --directory orchestrator/backend --extra dev pytest

  sync-lint:
    name: markdown-vs-CLI sync-lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Explicit, isolated run of the sync-lint so a failure points straight
      # at doc/CLI drift. It is also exercised by the full backend-tests job.
      - name: Run markdown-vs-CLI sync-lint
        run: uv run --directory orchestrator/backend --extra dev pytest tests/test_skill_cli_sync.py -q

  eval:
    name: deterministic eval (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # ABSOLUTE path on purpose — see header note about the false-green trap
      # when a relative path is resolved against --directory's cwd.
      - name: Run deterministic eval harness
        run: uv run --directory orchestrator/backend --extra dev pytest "${GITHUB_WORKSPACE}/tests/eval" -q

  root-tests:
    name: root tests — CLI + bench harness (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # ABSOLUTE path on purpose — see the header note about the false-green
      # trap when a relative path is resolved against --directory's cwd.
      # `tests/eval` is ignored here because the `eval` job owns it; running it
      # twice buys nothing and doubles the time to a red signal.
      # Never run a bare `pytest` from the repo root: duplicate
      # `test_vigil_cli.py` basenames in `tests/` and
      # `agent/scripts/assess/tests/` collide under one collection, which is why
      # these two suites are separate jobs rather than one invocation.
      - name: Run root test suite
        run: >-
          uv run --directory orchestrator/backend --extra dev pytest
          "${GITHUB_WORKSPACE}/tests" -q
          --ignore="${GITHUB_WORKSPACE}/tests/eval"

  assess-tests:
    name: assess CLI pytest (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # ABSOLUTE path on purpose — same false-green trap as above.
      - name: Run assess CLI test suite
        run: >-
          uv run --directory orchestrator/backend --extra dev pytest
          "${GITHUB_WORKSPACE}/agent/scripts/assess/tests" -q

  code-readiness:
    name: code readiness CLI (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run code transition/readiness contract tests
        run: >-
          uv run --directory orchestrator/backend --extra dev pytest
          "${GITHUB_WORKSPACE}/agent/scripts/assess/tests/test_code_coverage_gate.py"
          "${GITHUB_WORKSPACE}/agent/scripts/assess/tests/test_code_readiness_cli.py" -q

  frontend-build:
    name: frontend build (blocking)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orchestrator/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  ruff:
    name: ruff (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Blocking gate: the tree is lint-clean, so any new ruff finding fails
      # the PR.
      - name: ruff check
        run: uvx ruff check .

  mypy:
    name: mypy (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      # Blocking gate: src/vigil_cli is type-clean, so any new mypy error fails
      # the PR.
      - name: mypy
        run: uvx --with-editable . mypy src/vigil_cli

  nightly-live-eval-capture:
    name: nightly live eval-capture e2e (opt-in)
    # OFF the PR path: scheduled runs only. Scheduled workflows execute on the
    # default branch of the base repo, so forks and PRs never trigger this.
    # The opt-in secret is checked inside the step (env guard) rather than in a
    # job-level `if`, which keeps the gate unambiguous and lint-clean. The body
    # is a stub until the live capture harness has a CI-runnable entrypoint (it
    # needs a runtime + orchestrator stack and a captured golden engagement).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Live eval-capture e2e (stub)
        env:
          ENABLE_LIVE_EVAL_CAPTURE: ${{ secrets.ENABLE_LIVE_EVAL_CAPTURE }}
        run: |
          if [ -z "${ENABLE_LIVE_EVAL_CAPTURE}" ]; then
            echo "ENABLE_LIVE_EVAL_CAPTURE secret not set — skipping live eval-capture e2e."
            exit 0
          fi
          echo "Live eval-capture e2e is not yet wired for CI."
          echo "It requires a running runtime + orchestrator stack and a"
          echo "captured golden engagement. Tracked separately; this job is"
          echo "a scheduled placeholder kept off the PR path."
