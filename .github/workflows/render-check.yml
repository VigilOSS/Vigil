name: render-check

# Verify that every rendered prompt tree — AGENTS.md / AGENTS-blue.md /
# CLAUDE.md and the .claude/ .codex/ .goose/ .opencode/ .zcode/ client trees —
# is in sync with its source (agent/operator-core*.md + agent/agents/*.md +
# agent/commands/*.md).
#
# This catches the kind of drift that fired in May 2026: the publish-step
# fix landed in operator-core.md but AGENTS.md was not re-rendered, so
# dual-track operators reading from AGENTS.md hit a sys.exit(2) in
# transition_phase._phase_track. The render script's `check` mode renders
# to a tempdir and diffs against the on-disk copies, exiting 1 with a
# unified diff if anything is stale.
#
# To fix a failing check, run from the repo root:
#   cd agent && ./scripts/render-operator-prompts.sh repo

on:
  pull_request:
    # Every render input the script digests (source_stamp_sha) and every tree
    # its `check` mode diffs. A render output left off this list merges with the
    # gate never having run, then breaks the push: main build instead.
    paths:
      - "agent/operator-core.md"
      - "agent/operator-core-blue.md"
      - "agent/operator-core-code.md"
      - "agent/agents/**"
      - "agent/commands/**"
      - "agent/scripts/render-operator-prompts.sh"
      - "agent/AGENTS.md"
      - "agent/AGENTS-blue.md"
      - "agent/CLAUDE.md"
      - "agent/.claude/agents/**"
      - "agent/.claude/commands/**"
      - "agent/.codex/agents/**"
      - "agent/.codex/skills/**"
      - "agent/.goose/**"
      - "agent/.opencode/**"
      - "agent/.zcode/**"
      # Spelled out because these two manifests sit behind a dot-prefixed
      # directory, which a trailing ** is not guaranteed to expand across.
      - "agent/.zcode/.zcode-plugin/**"
      - "agent/.zcode/assessment/.zcode-plugin/**"
      - "agent/rules/**"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify rendered prompts match source
        run: |
          cd agent
          ./scripts/render-operator-prompts.sh check
