name: render-check

# Validate the prompt sources the generated client trees come from —
# AGENTS.md / AGENTS-blue.md / CLAUDE.md and the .claude/ .codex/ .goose/
# .opencode/ .zcode/ trees are rendered by `vigil install` from a checkout and
# by the release build, never committed. The script's `check` mode renders red
# and blue twice into temp dirs and fails when a roster role lacks a wrapper
# for any client, a command source is unregistered or missing, a capability
# block is malformed, the two renders differ, or an output falls outside the
# renderer's GENERATED_PATHS (which /.gitignore mirrors).

on:
  pull_request:
    # Every render input and the ignore list that mirrors GENERATED_PATHS. An
    # input left off this list merges with the gate never having run, then
    # breaks the push: main build instead.
    paths:
      - "agent/operator-core.md"
      - "agent/operator-core-blue.md"
      - "agent/operator-core-code.md"
      - "agent/agents/**"
      - "agent/commands/**"
      - "agent/scripts/render-operator-prompts.sh"
      - "agent/rules/**"
      - ".gitignore"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate prompt sources and render
        run: |
          cd agent
          ./scripts/render-operator-prompts.sh check
