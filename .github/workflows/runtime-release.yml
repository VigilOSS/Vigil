name: Matched runtime release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'VigilOSS/Vigil'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Validate release identity
        id: identity
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF_TYPE'] != 'tag' or os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Run from the version tag matching pyproject.toml, including manual runs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'release_tag=v{version}\n')
          PY
          python3 tools/check_public_commit_identity.py --revision HEAD
      - name: Check the immutable release target before publishing images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        run: |
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          checkout_commit=$(git rev-parse HEAD)
          test "$tag_commit" = "$checkout_commit"
          python3 - <<'PY_CHECK'
          import json, os, urllib.error, urllib.request
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/releases/tags/{os.environ["RELEASE_TAG"]}'
          request = urllib.request.Request(url, headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}', 'Accept': 'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              if release.get('draft') is not True:
                  raise SystemExit('Only a draft release can receive matched artifacts')
          PY_CHECK

  build-platform:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log into the project image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish the native runtime platform
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          PYTHONPATH: src
        run: |
          python3 tools/runtime_release.py build-platform \
            --release-tag "$RELEASE_TAG" \
            --platform "${{ matrix.platform }}" \
            --suffix "${{ matrix.suffix }}" \
            --revision "$GITHUB_SHA"

  release:
    needs: [preflight, build-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log into the project image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish and validate the multi-platform runtime index
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
          PYTHONPATH: src
        run: |
          python3 tools/runtime_release.py publish-index \
            --release-tag "$RELEASE_TAG" \
            --revision "$GITHUB_SHA"
      - name: Build matched wheel and source distribution
        run: uv build
      - name: Attach application artifacts to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Matched application and pinned Linux AMD64/ARM64 runtime. Review before publication.'
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep --quiet '^true$'
          gh release upload "$RELEASE_TAG" dist/* agent/docker/runtime-full/release-image.json --clobber
