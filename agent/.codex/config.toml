# Project-local Codex config for Vigil.
# These mirror agent/.claude/settings.json.
#
# HOOK TRUST. Project-layer trust and exact-hook trust are separate client
# conditions. The generated launcher passes --dangerously-bypass-hook-trust for
# Vigil's installed hook definitions, so a changed command does not depend on a
# persisted per-command approval. This does not attest hook delivery: verify
# actual activity/session receipts in the supported client. Installed instruction
# fingerprints describe files on disk, not hooks or role loading observed at run time.

# Compact once the active history reaches roughly half of a one-million-token
# context. Codex accepts an absolute token threshold, not a percentage.
model_auto_compact_token_limit = 510000

# `ensure_codex_config` replaces this sentinel with the mode-aware output of the
# canonical pre-compact.sh contract for each engagement. Keep one source of
# compaction truth rather than maintaining a second Codex-only prompt here.
compact_prompt = "__VIGIL_RENDER_COMPACT_PROMPT__"

# Keep the engagement record in Vigil's backend ledger, not in a second
# cross-session store. Mirrors "autoMemoryEnabled": false on the Claude side.
# Codex ships this off by default; pinning it here also overrides an operator
# whose global ~/.codex/config.toml turns it on.
[features]
memories = false

# Keep specialist dispatch a clean room. The operator must explicitly choose
# fresh context in the actual spawn schema (fork_turns = "none" when exposed),
# then direct the child to its canonical role and Load First files. This default
# is a configuration preference, not proof of any child's inherited context.
multi_agent_v2 = false

[hooks]

[[hooks.PostToolUse]]
matcher = "^(Bash|Agent|Write|Edit|apply_patch|mcp__.*)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "bash -c 'if [ -n \"${VIGIL_AGENT_ROOT:-}\" ]; then exec bash \"$VIGIL_AGENT_ROOT/scripts/hooks/post-tool-log.sh\"; fi; if [ -f scripts/hooks/post-tool-log.sh ]; then exec bash scripts/hooks/post-tool-log.sh; fi; if [ -f agent/scripts/hooks/post-tool-log.sh ]; then exec bash agent/scripts/hooks/post-tool-log.sh; fi'"
timeout = 10
async = true
statusMessage = "Recording tool activity"

[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = "bash -c 'if [ -n \"${VIGIL_AGENT_ROOT:-}\" ]; then exec bash \"$VIGIL_AGENT_ROOT/scripts/hooks/post-compact-resume.sh\"; fi; if [ -f scripts/hooks/post-compact-resume.sh ]; then exec bash scripts/hooks/post-compact-resume.sh; fi; if [ -f agent/scripts/hooks/post-compact-resume.sh ]; then exec bash agent/scripts/hooks/post-compact-resume.sh; fi'"
timeout = 30
additionalContextLimit = 5000
statusMessage = "Rehydrating Vigil operator state"

# Session-end activity receipt. No matcher: SessionEnd has no tool to match on.
# Codex fires this on client-driven session termination (`clear`, `logout`, normal
# exit -> `other`); a hard crash / SIGKILL / host timeout fires nothing, which is
# why session-end.sh is fail-safe and idempotent rather than a durability guarantee.
#
# Codex's PreCompact stdout is ignored, so compaction steering comes from the
# rendered `compact_prompt` above. SessionStart(compact) supplies the other half:
# automatic authoritative-state hydration before the immediate continuation.
#
# The 3s timeout below is not a preference. Codex 0.154.0 hard-caps SessionEnd at
# 3s and warns "clamping SessionEnd hook timeout to 3s" on every launch for any
# larger value; the PostToolUse cap is far higher, so only this one
# differs from Claude's 10s. 3s is already twice Claude Code's own 1500ms default
# for the same hook, and session-end.sh claims its marker BEFORE the backend call
# precisely so a budget cut loses a receipt rather than duplicating a row.
[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = "bash -c 'if [ -n \"${VIGIL_AGENT_ROOT:-}\" ]; then exec bash \"$VIGIL_AGENT_ROOT/scripts/hooks/session-end.sh\"; fi; if [ -f scripts/hooks/session-end.sh ]; then exec bash scripts/hooks/session-end.sh; fi; if [ -f agent/scripts/hooks/session-end.sh ]; then exec bash agent/scripts/hooks/session-end.sh; fi'"
timeout = 3
statusMessage = "Recording session-end activity"
