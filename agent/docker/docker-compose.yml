services:
  runtime-full:
    build:
      context: ../..
      dockerfile: agent/docker/runtime-full/Dockerfile
    image: security-research:latest
    cap_add:
      - NET_RAW
      - NET_ADMIN

  runtime-lightweight-dev:
    # Development-only image for faster local Dockerfile iteration. Operator
    # workflows and docs use the full runtime image.
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: agent/docker/runtime-lightweight/Dockerfile
    image: security-research-lightweight:latest
    cap_add:
      - NET_RAW
      - NET_ADMIN

  mitmproxy:
    build:
      context: ..
      dockerfile: docker/mitmproxy/Dockerfile
    image: security-research-proxy:latest
