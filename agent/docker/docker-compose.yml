services:
  runtime-full:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: security-research:latest
    cap_add:
      - NET_RAW
      - NET_ADMIN

  runtime-lightweight:
    profiles: ["lightweight"]
    build:
      context: ../..
      dockerfile: agent/docker/kali-redteam-lightweight/Dockerfile
    image: security-research-lightweight:latest
    cap_add:
      - NET_RAW
      - NET_ADMIN

  mitmproxy:
    build:
      context: ..
      dockerfile: docker/mitmproxy/Dockerfile
    image: redteam-proxy:latest

  metasploit:
    build:
      context: ./metasploit
    image: redteam-metasploit:latest
    environment:
      MSF_USER: ${MSF_USER:-msf}
      MSF_PASSWORD: ${MSF_PASSWORD:-msf}
      MSF_PORT: ${MSF_PORT:-55553}
      MSF_SSL: ${MSF_SSL:-false}
    ports:
      - "127.0.0.1:${MSF_PORT:-55553}:55553"
