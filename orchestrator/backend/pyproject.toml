[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-orchestrator-backend"
version = "2.0.0"
description = "Local engagement orchestrator for Vigil"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "rich>=14,<15",
    "httpx>=0.27,<1",
    "psutil==7.2.2",
    "pytest>=9,<10",
    "pytest-xdist>=3,<4",
    "tree-sitter==0.26.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.24.1",
    "tree-sitter-c-sharp==0.23.5",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require a live runtime container; deselected by default and run via `pytest -m integration` after image rebuild.",
]
# `-n auto` runs the suite across one worker per CPU (pytest-xdist). The suite
# is process-parallel safe: every test gets its own temp tree from the
# `isolate_settings` fixture, the only HTTP server it starts binds port 0, and
# nothing writes into the checkout. Serial is ~4.5x slower for the same result.
# Pass `-n 0` to force single-process execution when debugging (needed for
# `--pdb`, and for reading `--durations` as CPU rather than wall time).
addopts = "-m 'not integration' -n auto"
