[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-research"
version = "0.1.0"
description = "Universal CLI for AI Threat Hunting installs, engagements, runtime, and orchestrator operations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aith = "ai_threat_hunting_cli.main:main"
security-research = "ai_threat_hunting_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Mirrors orchestrator/backend/pyproject.toml: integration tests need a live
# runtime container (operator-controlled frp + interactsh) and are deselected
# by default. Run them explicitly with `pytest -m integration`.
markers = [
    "integration: end-to-end tests that require a live runtime container; deselected by default and run via `pytest -m integration` after image rebuild.",
]
addopts = "-m 'not integration'"

