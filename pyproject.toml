[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.3.0"
description = "Universal CLI for Vigil installs, engagements, runtime, and orchestrator operations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*"]
authors = [{name = "Vigil OSS Maintainers"}]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/vigil-oss/vigil"
Issues = "https://github.com/vigil-oss/vigil/issues"
Source = "https://github.com/vigil-oss/vigil"

[project.scripts]
vigil = "vigil_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vigil_cli = [
    "bench/factory/families/*/*",
    "bench/factory/families/*/skeleton/*",
]

[tool.mypy]
# Bench `skeleton/` files are container-runtime sidecars: they import runtime-only
# siblings copied into the image at build time (e.g. `oracle_checkpoint`) that
# mypy cannot resolve. They are not part of the `vigil_cli` type surface, so
# exclude the skeleton dirs from type-checking. (Applies during mypy's directory
# walk, which is how CI invokes it: `mypy src/vigil_cli`.)
exclude = "src/vigil_cli/bench/factory/families/.*/skeleton/"

[tool.ruff.lint]
# Keep the blocking lint gate stable across unpinned Ruff releases. These are
# Ruff's historical default correctness rules; broader style policy is not an
# implicit dependency upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Mirrors orchestrator/backend/pyproject.toml: integration tests need a live
# runtime container (operator-controlled frp + interactsh) and are deselected
# by default. Run them explicitly with `pytest -m integration`.
markers = [
    "integration: end-to-end tests that require a live runtime container; deselected by default and run via `pytest -m integration` after image rebuild.",
]
addopts = "-m 'not integration'"
