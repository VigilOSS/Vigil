[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "vigil_build"
backend-path = ["."]

[project]
name = "vigil"
version = "2.3.1"
description = "Universal CLI for Vigil installs, engagements, runtime, and orchestrator operations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/licenses/*"]
authors = [{name = "Vigil OSS Maintainers", email = "vigil.oss@proton.me"}]
requires-python = ">=3.11"
dependencies = ["questionary>=2.1.1,<3", "rich>=14,<15"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/VigilOSS/Vigil"
Issues = "https://github.com/VigilOSS/Vigil/issues"
Source = "https://github.com/VigilOSS/Vigil"

[project.scripts]
vigil = "vigil_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["vigil_cli._bundle*"]

[tool.mypy]
files = ["src/vigil_cli"]

[tool.ruff.lint]
# Keep the blocking lint gate stable across unpinned Ruff releases. These are
# Ruff's historical default correctness rules; broader style policy is not an
# implicit dependency upgrade.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
# Mirrors orchestrator/backend/pyproject.toml: integration tests need a live
# runtime container (operator-controlled frp + interactsh) and are deselected
# by default. Run them explicitly with `pytest -m integration`.
markers = [
    "integration: end-to-end tests that require a live runtime container; deselected by default and run via `pytest -m integration` after image rebuild.",
]
addopts = "-m 'not integration'"
